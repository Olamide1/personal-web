<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Lamide</title>
  <meta name="description" content="Get in touch with Lamide about collaborations, roles, or just to connect">
  
  <link rel="icon" type="image/jpeg" href="/assets/img/icon.jpg">
  <link rel="apple-touch-icon" href="/assets/img/icon.jpg">
  <meta name="theme-color" content="#EBE4D0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
</head>
<body data-pigment="rose">
  <header class="top">
    <div class="wrap">
      <a class="wordmark" href="/"><span class="emblem rosette" data-rosette="emblem" aria-hidden="true"></span>LAMIDE</a>
      <nav class="nav" id="siteNav" aria-label="Primary">
        <a href="/">Home</a>
        <a href="/about.html">About</a>
        <a href="/projects.html">Projects</a>
        <a href="/blog.html">Blog</a>
        <a href="/now.html">Now</a>
        <a href="/contact.html" class="active" aria-current="page">Contact</a>
      </nav>
      <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="planSheet"><span class="mb-icon" aria-hidden="true"></span><span class="l-d">Plan</span><span class="l-m">Menu</span></button>
    </div>
    <div class="braid thin hdr-braid" aria-hidden="true"></div>
  </header>

  <main id="main-content">
    <section class="contact-page">
      <div class="wrap">
        <div class="plate" data-corners>
          <div class="serials" aria-hidden="true">
            <span class="serial" data-serial></span>
            <span class="micro-wrap"><span class="micro" data-micro></span></span>
            <span class="serial" data-serial></span>
          </div>
          <div class="frieze" aria-hidden="true"><span class="braid"></span><b>CORRESPONDENCE</b><span class="braid"></span></div>
          <h1 class="engraved">Get in touch</h1>
          <p class="lede">Collaborations, roles, or a conversation about AI agents and product. Pick the channel you prefer.</p>

          <div class="art compact is-loading" data-hands="contact"><canvas role="img" aria-label="An engraving of two hands reaching toward each other"></canvas></div>

          <div class="contact-options" id="contact-menu">
            <button class="contact-option" type="button" data-hands-trigger="contact" data-choice="twitter" id="option-1">
              <span class="contact-option-number">I</span>
              <span class="contact-option-title">Twitter DM</span>
              <span class="contact-option-go" aria-hidden="true">&rarr;</span>
              <span class="contact-option-desc">Fast and casual</span>
            </button>
            <button class="contact-option" type="button" data-hands-trigger="contact" data-choice="linkedin" id="option-2">
              <span class="contact-option-number">II</span>
              <span class="contact-option-title">LinkedIn message</span>
              <span class="contact-option-go" aria-hidden="true">&rarr;</span>
              <span class="contact-option-desc">Professional</span>
            </button>
          </div>
          <p class="key-hint">Press 1 or 2 on your keyboard</p>
          <div class="micro-wrap" aria-hidden="true"><span class="micro" data-micro></span></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__links">
      <a href="https://github.com/olamide1" target="_blank" rel="noopener">GitHub</a>
      <a href="https://twitter.com/theakomolafe" target="_blank" rel="noopener">Twitter</a>
      <a href="https://linkedin.com/in/theakomolafe" target="_blank" rel="noopener">LinkedIn</a>
    </div>
    <div class="footer-stats">
      <span id="guest-counter"></span>
      <span id="load-time"></span>
    </div>
    <div>Made by Lamide 2025</div>
  </footer>

  <script src="/assets/js/engrave.js" defer></script>
  <script src="/assets/js/art.js" defer></script>
  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/scenes.js" defer></script>
  <script src="/assets/js/chrome.js" defer></script>
  
  <script>
    // Contact page: choose a channel (click, or press 1 / 2)
    (function () {
      var URLS = {
        twitter: 'https://twitter.com/theakomolafe',
        linkedin: 'https://linkedin.com/in/theakomolafe'
      };
      var leaving = false;

      function go(choice) {
        if (leaving) return;
        leaving = true;
        // the fingers touch first, then we go
        var art = window.HandsArts && window.HandsArts.contact;
        if (art) art.to(art.pose.touch, 450, null, art.spark);
        document.body.style.transition = 'opacity 0.4s ease 0.55s';
        document.body.style.opacity = '0.4';
        setTimeout(function () { window.location.href = URLS[choice]; }, art ? 1000 : 250);
      }

      document.getElementById('option-1').addEventListener('click', function () { go('twitter'); });
      document.getElementById('option-2').addEventListener('click', function () { go('linkedin'); });

      document.addEventListener('keydown', function (e) {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key === '1') go('twitter');
        else if (e.key === '2') go('linkedin');
      });

      // Coming back via the back button restores the page from cache: undo the fade
      window.addEventListener('pageshow', function () {
        leaving = false;
        document.body.style.opacity = '';
      });
    })();
  </script>
</body>
</html>
